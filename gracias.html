<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias! | True Essence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --earth-brown: #5d4037; --soft-cream: #f4f1ea; }
        body { 
            font-family: 'Nanum Myeongjo', serif; 
            background-color: var(--soft-cream); 
            color: var(--earth-brown); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .brand-font { font-family: 'Dancing Script', cursive; }
        .thanks-card { text-align: center; padding: 40px; }
        .btn-back { 
            display: inline-block; 
            margin-top: 20px; 
            padding: 10px 25px; 
            border: 1px solid var(--earth-brown); 
            color: var(--earth-brown); 
            text-decoration: none; 
            transition: 0.3s; 
        }
        .btn-back:hover { 
            background-color: var(--earth-brown); 
            color: white; 
        }
    </style>
</head>
<body>

    <div class="thanks-card">
        <h1 class="brand-font display-3">¡Gracias por tu comentario!</h1>
        <p class="fs-5">Hemos recibido tu mensaje con mucho amor. <br> Te responderemos muy pronto.</p>
        <a href="index.html" class="btn-back">VOLVER AL INICIO</a>
    </div>

</body>
</html>
