<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | True Essence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --kraft-paper: #d2b48c; --earth-brown: #5d4037; --soft-cream: #f4f1ea; }
        body { font-family: 'Nanum Myeongjo', serif; background-color: var(--soft-cream); color: var(--earth-brown); }
        .brand-font { font-family: 'Dancing Script', cursive; }
        .contact-card { background: white; border: 1px solid var(--kraft-paper); padding: 40px; }
        .form-control { border-radius: 0; border: 1px solid var(--kraft-paper); background-color: transparent; }
        .form-control:focus { box-shadow: none; border-color: var(--earth-brown); }
        .btn-send { background-color: var(--earth-brown); color: white; border-radius: 0; width: 100%; transition: 0.3s; border: none; }
        .btn-send:hover { background-color: var(--kraft-paper); }
        .insta-link { color: var(--earth-brown); text-decoration: none; transition: 0.3s; }
        .insta-link:hover { color: var(--kraft-paper); text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="text-center mb-4">
                    <a href="index.html" style="color: var(--earth-brown); text-decoration: none;">← Inicio</a>
                    <h1 class="brand-font display-4 mt-3">Cuéntanos algo</h1>
                    <p>¿Tienes dudas sobre un ingrediente o quieres un pedido especial?</p>
                </div>
                
                <div class="contact-card">
                    <form action="gracias.html">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">NOMBRE</label>
                            <input type="text" class="form-control" placeholder="Tu nombre" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">CORREO ELECTRÓNICO</label>
                            <input type="email" class="form-control" placeholder="hola@ejemplo.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">TU MENSAJE</label>
                            <textarea class="form-control" rows="5" placeholder="¿En qué podemos ayudarte?" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-send py-2">ENVIAR CON AMOR</button>
                    </form>
                </div>

                <div class="text-center mt-5">
                    <p class="mb-1">📍 Taller True Essence</p>
                    <p class="mb-1">📸 <a href="https://www.instagram.com/true__.essence" target="_blank" class="insta-link">@true__.essence</a></p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
